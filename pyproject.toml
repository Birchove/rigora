[project]
name = "research-mentor-core"
version = "0.1.0"
description = "Rigora: deterministic multi-agent research mentor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "anyio>=4.14.2",
    "fastapi>=0.141.1",
    "firecrawl-anydoc>=0.2.4",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
local-ranking = [
    "flagembedding>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_mentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
